# Run a basic docker container for quick testing or exploring the BlackLab Frontend

services:
  frontend:
    image: instituutnederlandsetaal/blacklab-frontend:dev
    build:
      context: ..
      dockerfile: docker/frontend-bls.dockerfile
      args: 
        BLACKLAB_IMAGE_VERSION: dev
    ports:
      - "8080:8080" # frontend and BLS will both be available on 8080
    volumes:
      - ./data/index:/data/index
      - ./data/user-index:/data/user-index
      - ./data/index-configs:/etc/blacklab/projectconfigs
      
    configs: 
      - source: blacklab-server
        target: /etc/blacklab/blacklab-server.yaml
        mode: 0444 # read-only for the container
    
configs: 
  blacklab-server: 
    content: |
      ---
      # BlackLab Server configuration, see https://blacklab.ivdnt.org/server/configuration.html
      
      # Where corpora can be found (inside the container)
      # (list directories whose subdirectories are indexed corpora, or directories containing a single indexed corpus)
      indexLocations:
        - /data/index
      
      # Where user-created corpora will be stored (inside the container)
      # (note that user corpora only works if authentication is enabled)
      userIndexes: /data/user-index

      # Hardcoded debug user for testing purposes (no login required)
      authentication:
        system: 
          class: AuthDebugFixed
          userId: test_user
