name: Publish Docker image

on:
  push:
    branches: [main, dev, experimental]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: docker-publish
  queue: max

jobs:
  publish:
    if: (github.ref_type == 'branch' && !github.event.deleted) || (github.ref_type == 'tag' && github.event.created)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and publish
        run: python3 scripts/build_docker.py "$GITHUB_REF_NAME" --push
